server:
  port: 8080

spring:
  application:
    name: media-api
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/media}
    username: ${SPRING_DATASOURCE_USERNAME:media}
    password: ${SPRING_DATASOURCE_PASSWORD:media}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  health:
    kafka:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics,info

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  cors:
    # Vite dev server origins for the media-web front-end
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # The SSE relay's Kafka consumer group id is intentionally NOT defined here.
  # Fan-out needs a unique group per process, but ${random.uuid} yields a new
  # value on every placeholder resolution, which would put each listener in a
  # separate group. It is resolved once in RelayGroup instead, and can be
  # overridden with the APP_STREAM_RELAY_GROUP_ID environment variable.
  minio:
    endpoint: ${APP_MINIO_ENDPOINT:http://localhost:9000}
    # Origin handed to browsers for HLS playback. Defaults to the internal
    # endpoint, which is only correct when the API runs outside Docker.
    public-endpoint: ${APP_MINIO_PUBLIC_ENDPOINT:${APP_MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${APP_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${APP_MINIO_SECRET_KEY:minioadmin}
    bucket: ${APP_MINIO_BUCKET:media}
  kafka:
    topic:
      partitions: ${APP_KAFKA_TOPIC_PARTITIONS:3}
      replicas: ${APP_KAFKA_TOPIC_REPLICAS:1}
      # Set min-insync-replicas when replicas > 1 (e.g. 2 for prod with replicas=3)
      min-insync-replicas: ${APP_KAFKA_TOPIC_MIN_INSYNC_REPLICAS:}
  jwt:
    secret: ${APP_JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
    expiration: ${APP_JWT_EXPIRATION:86400000} # 24 hours
